<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Privado - Verificación en Dos Pasos (2FA)</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 340px; text-align: center; }
    h2 { margin-top: 0; color: #1e293b; }
    p { font-size: 0.875rem; color: #64748b; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1.25rem; text-align: center; letter-spacing: 4px; }
    button { width: 100%; padding: 0.6rem; background: #059669; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #047857; }
    .error { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Verificación TOTP</h2>
    <p>Ingresa el código de 6 dígitos generado por tu aplicación de autenticación.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/mfa">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <input type="text" id="totp_code" name="totp_code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" autocomplete="one-time-code">
      </div>
      <button type="submit" id="verify-btn">Verificar e Ingresar</button>
    </form>
  </div>
</body>
</html>
