<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Privado - Verificación CAPTCHA</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    body { font-family: sans-serif; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 360px; }
    h2 { margin-top: 0; color: #1e293b; font-size: 1.35rem; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #0284c7; color: #fff; margin-bottom: 0.75rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.875rem; color: #475569; font-weight: 500; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
    button { width: 100%; padding: 0.65rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; }
    .captcha-container { background: #0f172a; border-radius: 6px; padding: 12px; text-align: center; margin-bottom: 1rem; }
    .captcha-svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .captcha-hint { font-size: 0.8rem; color: #94a3b8; margin: 6px 0 0 0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">BARRERA 2 DE 4: CAPTCHA ANTI-BOT</span>
    <h2>Reto de Seguridad</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/captcha">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="captcha-container">
        <svg id="captcha-svg" class="captcha-svg" width="220" height="70" viewBox="0 0 220 70" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="#0f172a" rx="6"/>
          <!-- Ruido visual para requerir OCR o Vision -->
          <line x1="10" y1="18" x2="210" y2="52" stroke="#334155" stroke-width="2"/>
          <line x1="15" y1="58" x2="205" y2="12" stroke="#334155" stroke-width="1.5"/>
          <circle cx="45" cy="35" r="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>
          <circle cx="160" cy="35" r="22" fill="none" stroke="#1e293b" stroke-width="1.5"/>
          <text id="captcha-text" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="26" fill="#38bdf8" font-weight="bold" letter-spacing="3">{{ captcha_display }}</text>
        </svg>
        <p class="captcha-hint" id="captcha-hint">Resuelva la operación aritmética o ingrese el código alfanumérico</p>
      </div>
      <div class="form-group">
        <label for="captcha">Respuesta</label>
        <input type="text" id="captcha" name="captcha" placeholder="Ej: {{ captcha_expected if debug else '' }}" required autocomplete="off" autofocus>
      </div>
      <button type="submit" id="captcha-submit-btn">Verificar y Continuar</button>
    </form>
  </div>
</body>
</html>
